; PHP-FPM Pool Configuration
; Ensure environment variables are passed to PHP scripts

[www]
user = www-data
group = www-data

listen = 9000

; CRITICAL: Allow environment variables to be passed to PHP
; Without this, getenv() will return empty values
clear_env = no

; Process management settings
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Security settings
security.limit_extensions = .php

; Logging
access.log = /proc/self/fd/2
access.format = "%R - %u %T \"%M\""
slowlog = /proc/self/fd/2
request_slowlog_timeout = 5s
